<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Lucas da Silva Moutinho - evolução de SQL, Python, ML, LLM e Agents até IA" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#14213D"/>
      <stop offset="1" stop-color="#0B3A4A"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00D4FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .title { font: 700 50px 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 1px; }
      .tag   { font: 600 15px 'Courier New', Consolas, monospace; fill: #00D4FF; letter-spacing: 3px; }
      .chip  { font: 600 13px 'Courier New', Consolas, monospace; fill: #E6F7FF; letter-spacing: 1px; }
      .lbl   { font: 700 14px 'Courier New', Consolas, monospace; fill: #DDF3FF; text-anchor: middle; }
      .num   { font: 600 11px 'Courier New', Consolas, monospace; fill: #6F849A; text-anchor: middle; letter-spacing: 1px; }
      .ai    { font: 700 22px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #FFFFFF; text-anchor: middle; }
      .draw  { stroke-dasharray: 600; animation: draw 4s ease-out both; }
      .area  { animation: fade 4s ease-out both; }
      .n     { animation: pop .5s ease-out both; transform-box: fill-box; transform-origin: center; }
      .halo  { animation: halo 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes draw { from { stroke-dashoffset: 600; } to { stroke-dashoffset: 0; } }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pop  { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: scale(1); } }
      @keyframes halo { 0%,100% { opacity: .15; transform: scale(1); } 50% { opacity: .6; transform: scale(1.6); } }
    </style>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <circle cx="1080" cy="40" r="170" fill="#7C5CFF" opacity="0.10"/>
  <circle cx="120" cy="260" r="150" fill="#00D4FF" opacity="0.08"/>

  <!-- eixo e linhas guia -->
  <line x1="700" y1="244" x2="1170" y2="244" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1"/>
  <g stroke="#FFFFFF" stroke-opacity="0.10" stroke-dasharray="3 5">
    <line x1="720" y1="226" x2="720" y2="244"/>
    <line x1="806" y1="198" x2="806" y2="244"/>
    <line x1="892" y1="166" x2="892" y2="244"/>
    <line x1="978" y1="126" x2="978" y2="244"/>
    <line x1="1064" y1="86" x2="1064" y2="244"/>
    <line x1="1140" y1="48" x2="1140" y2="244"/>
  </g>
  <text class="num" x="720" y="262">01</text>
  <text class="num" x="806" y="262">02</text>
  <text class="num" x="892" y="262">03</text>
  <text class="num" x="978" y="262">04</text>
  <text class="num" x="1064" y="262">05</text>
  <text class="num" x="1140" y="262">06</text>

  <!-- gráfico evolutivo: SQL → Python → ML → LLM → Agents → AI -->
  <path class="area" d="M720,226 L806,198 L892,166 L978,126 L1064,86 L1140,48 L1140,244 L720,244 Z" fill="url(#area)"/>
  <polyline class="draw" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
    points="720,226 806,198 892,166 978,126 1064,86 1140,48"/>

  <g fill="#0D1117" stroke="#00D4FF" stroke-width="2.5">
    <circle class="n" cx="720" cy="226" r="9" style="animation-delay:.2s"/>
    <circle class="n" cx="806" cy="198" r="9" style="animation-delay:.9s"/>
    <circle class="n" cx="892" cy="166" r="9" style="animation-delay:1.6s"/>
    <circle class="n" cx="978" cy="126" r="9" style="animation-delay:2.3s"/>
    <circle class="n" cx="1064" cy="86" r="9" style="animation-delay:3s"/>
  </g>
  <g class="n" style="animation-delay:3.6s">
    <circle class="halo" cx="1140" cy="48" r="34" fill="url(#glow)"/>
    <circle cx="1140" cy="48" r="23" fill="#7C5CFF" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2"/>
    <text class="ai" x="1140" y="56">AI</text>
  </g>

  <g>
    <text class="lbl n" x="712" y="208" style="animation-delay:.2s">SQL</text>
    <text class="lbl n" x="798" y="180" style="animation-delay:.9s">Python</text>
    <text class="lbl n" x="884" y="148" style="animation-delay:1.6s">ML</text>
    <text class="lbl n" x="970" y="108" style="animation-delay:2.3s">LLM</text>
    <text class="lbl n" x="1056" y="68" style="animation-delay:3s">Agents</text>
  </g>

  <text x="70" y="82" class="tag">DATA SCIENCE  •  MACHINE LEARNING  •  AI AGENTS</text>
  <text x="70" y="158" class="title"><tspan fill="#FFFFFF">Lucas da Silva </tspan><tspan fill="#00D4FF">Moutinho</tspan></text>
  <rect x="70" y="186" width="140" height="5" rx="2.5" fill="url(#line)"/>
  <text x="228" y="196" class="chip">Itaú • UFABC • LLMs • Agentes</text>
</svg>
