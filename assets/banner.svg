<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Lucas Moutinho - Data Scientist" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#14213D"/>
      <stop offset="1" stop-color="#0B3A4A"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .title { font: 700 66px 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 1px; }
      .sub   { font: 500 22px 'Courier New', Consolas, monospace; fill: #9FB3C8; }
      .tag   { font: 600 15px 'Courier New', Consolas, monospace; fill: #00D4FF; letter-spacing: 3px; }
      .draw  { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 3.5s ease-out forwards; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes draw  { to { stroke-dashoffset: 0; } }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.5); } }
    </style>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#grid)"/>
  <circle cx="1080" cy="40" r="170" fill="#7C5CFF" opacity="0.10"/>
  <circle cx="120" cy="260" r="150" fill="#00D4FF" opacity="0.08"/>

  <!-- gráfico decorativo -->
  <polyline class="draw" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
    points="640,215 720,190 790,200 860,150 930,165 1000,110 1070,125 1140,70"/>
  <g fill="#00D4FF">
    <circle class="pulse" cx="860" cy="150" r="5"/>
    <circle class="pulse" cx="1000" cy="110" r="5" style="animation-delay:.6s"/>
    <circle class="pulse" cx="1140" cy="70" r="6" fill="#7C5CFF" style="animation-delay:1.2s"/>
  </g>

  <text x="70" y="82" class="tag">DATA SCIENCE  •  ITAÚ UNIBANCO  •  UFABC</text>
  <text x="70" y="160" class="title" fill="url(#title)">Lucas Moutinho</text>
  <text x="70" y="208" class="sub">Data Scientist | Crédito &amp; Recuperação | ML</text>
  <rect x="70" y="228" width="140" height="5" rx="2.5" fill="url(#line)"/>
</svg>
